# CI pipeline – platform-foundation task 7.1
#
# Triggers on pull_request and on push to main only (see ci-usage-reduction spec).
# A `changes` job path-filters the diff; jobs run in two tiers:
#
#   Always (every PR + push to main):  lint-and-typecheck → unit-tests → build-images
#   Heavy / opt-in (main push, PR base=main, or `full-ci` label; area-gated):
#       integration-tests → scale-test, plus cdk-synth (infra only) and perf-test
#
# A push to main runs ALL tiers, so the deploy gate is unchanged: deploy.yml
# triggers on `workflow_run` of this workflow completing success on `main`
# (Req 8.4). The workflow name MUST stay "CI" because deploy.yml references it
# by name in its `workflow_run.workflows` trigger.
name: CI

on:
  # Push to main only (merges) — this is the deploy gate. Feature-branch
  # commits are covered by the pull_request trigger, so CI runs once per
  # change instead of once for the branch push AND once for the PR.
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so only the latest commit is tested.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # 0. Classify the diff so heavy jobs can be skipped for irrelevant changes.
  #    Outputs: backend / frontend / infra (code areas) and docs_only.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/**/*.md'
              - 'Makefile'
              - 'docker-compose.yml'
              - '.env.example'
              - 'fixtures-site/**'
              - 'evals/**'
            frontend:
              - 'frontend/**'
              - '!frontend/**/*.md'
            infra:
              - 'infra/**'
              - '!infra/**/*.md'
            docs_only:
              - '**/*.md'
              - 'docs/**'
              - 'sessions/**'
              - '.kiro/**'

  # 1. Lint + type checks: ruff, ruff format --check, mypy (backend); eslint, tsc (frontend).
  lint-and-typecheck:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python ${{ env.PYTHON_VERSION }})
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and type check (make lint)
        run: make lint

  # 2. Unit + property tests with backend coverage (Req 8.1, 8.5) and frontend vitest.
  unit-tests:
    name: Unit and property tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python ${{ env.PYTHON_VERSION }})
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # pyproject sets addopts "--cov=app --cov-report=term-missing --cov-report=xml".
      # We mirror `make test-backend` here (rather than calling it) so we can also
      # emit a markdown coverage summary into the GitHub job summary (Req 8.5).
      - name: Backend unit + property tests with coverage
        working-directory: backend
        run: uv run pytest tests/unit tests/property

      - name: Write backend coverage summary to job summary
        if: ${{ always() }}
        working-directory: backend
        run: |
          {
            echo "## Backend coverage"
            echo ""
            echo '```'
            uv run coverage report || echo "coverage report unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

  # 3. Build both container images (Req 8.7). Uses buildx so the integration job
  # can rely on the same images via docker compose. We build to the local docker
  # image store so compose can reuse them.
  build-images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Pull BuildKit from the GCR mirror of Docker Hub (no rate limits /
          # no Docker Hub reachability flakiness) instead of registry-1.docker.io,
          # which intermittently times out on hosted runners
          # (context deadline exceeded pulling moby/buildkit). Keeps the
          # docker-container driver so type=gha cache still works.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # NOTE: the docker-container buildx driver has its own cache, so a
      # host-level pre-pull can't feed its COPY --from. The public-ECR
      # adapter/base layers are instead kept warm via the type=gha cache
      # below (mode=max), so a cold-cache run is the only one that pulls from
      # public.ecr.aws; re-run the job if it hits a transient 429 there.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: reviewlens-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build workers image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.workers
          push: false
          load: true
          tags: reviewlens-workers:ci
          cache-from: type=gha,scope=workers
          cache-to: type=gha,mode=max,scope=workers

  # 4. Container integration tests against PostgreSQL + LocalStack + fixtures
  #    via docker-compose (Req 8.2, 8.7). `make test-int` runs
  #    `docker compose up -d --wait` then pytest -m integration.
  integration-tests:
    name: Container integration tests
    runs-on: ubuntu-latest
    needs: [changes, build-images]
    if: >-
      needs.changes.outputs.backend == 'true' &&
      ( github.ref == 'refs/heads/main' ||
        github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci') )
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker registry mirror (avoid Docker Hub flakiness)
        # Route Docker Hub pulls through the GCR pull-through cache so the
        # Compose stack (postgres/localstack/nginx) doesn't fail CI when
        # registry-1.docker.io is slow or 5xx (seen: 502, timeouts).
        # Name-agnostic; mirror.gcr.io falls through to Docker Hub on a miss.
        run: |
          echo '{ "registry-mirrors": ["https://mirror.gcr.io"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Pre-pull public ECR images (retry on 429)
        # public.ecr.aws rate-limits anonymous pulls; the Lambda Web Adapter
        # and Amazon Linux base images are pulled by the Dockerfiles / compose
        # builds and intermittently 429 (toomanyrequests). GCR mirrors Docker
        # Hub but not public ECR, so pre-pull these with backoff into the local
        # image cache; buildx COPY --from and compose then reuse the cached
        # image instead of re-hitting the registry.
        run: |
          images="public.ecr.aws/awsguru/aws-lambda-adapter:0.8.4 public.ecr.aws/amazonlinux/amazonlinux:2023"
          for img in $images; do
            n=0
            until docker pull "$img"; do
              n=$((n+1))
              if [ "$n" -ge 6 ]; then echo "giving up on $img after $n attempts"; exit 1; fi
              echo "pull of $img failed (attempt $n); backing off..."; sleep $((n*20))
            done
          done

      - name: Set up uv (Python ${{ env.PYTHON_VERSION }})
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Create .env from .env.example (local-equivalent config)
        # make test-int sources the repo-root .env so the DB-backed integration
        # tests get DATABASE_URL (localhost psycopg) and ENV=local. CI has no
        # .env, so copy the committed example, which holds the same localhost
        # values and no real secrets. Without this the ~140 DB-backed tests
        # self-skip (PostgreSQL not reachable) and only the LocalStack-only
        # tests run.
        run: cp .env.example .env

      - name: Run container integration tests (make test-int)
        run: make test-int

      - name: Dump compose logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color || true

      - name: Tear down compose stack
        if: ${{ always() }}
        run: docker compose down -v || true

  # 5. Scale test: two consumer instances against shared queues (Req 8.8).
  scale-test:
    name: Scale test
    runs-on: ubuntu-latest
    needs: [changes, integration-tests]
    if: >-
      needs.changes.outputs.backend == 'true' &&
      ( github.ref == 'refs/heads/main' ||
        github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci') )
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker registry mirror (avoid Docker Hub flakiness)
        # Route Docker Hub pulls through the GCR pull-through cache so the
        # Compose stack (postgres/localstack/nginx) doesn't fail CI when
        # registry-1.docker.io is slow or 5xx (seen: 502, timeouts).
        # Name-agnostic; mirror.gcr.io falls through to Docker Hub on a miss.
        run: |
          echo '{ "registry-mirrors": ["https://mirror.gcr.io"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Pre-pull public ECR images (retry on 429)
        # public.ecr.aws rate-limits anonymous pulls; the Lambda Web Adapter
        # and Amazon Linux base images are pulled by the Dockerfiles / compose
        # builds and intermittently 429 (toomanyrequests). GCR mirrors Docker
        # Hub but not public ECR, so pre-pull these with backoff into the local
        # image cache; buildx COPY --from and compose then reuse the cached
        # image instead of re-hitting the registry.
        run: |
          images="public.ecr.aws/awsguru/aws-lambda-adapter:0.8.4 public.ecr.aws/amazonlinux/amazonlinux:2023"
          for img in $images; do
            n=0
            until docker pull "$img"; do
              n=$((n+1))
              if [ "$n" -ge 6 ]; then echo "giving up on $img after $n attempts"; exit 1; fi
              echo "pull of $img failed (attempt $n); backing off..."; sleep $((n*20))
            done
          done

      - name: Set up uv (Python ${{ env.PYTHON_VERSION }})
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Run scale test (make test-scale)
        run: make test-scale

      - name: Dump compose logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color || true

      - name: Tear down compose stack
        if: ${{ always() }}
        run: docker compose down -v || true

  # 6. CDK assertion tests + synth (Req: the synth gate). `make synth` runs
  #    `cd infra && npm ci && npm test && npx cdk synth`.
  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: [changes]
    if: >-
      needs.changes.outputs.infra == 'true' &&
      ( github.ref == 'refs/heads/main' ||
        github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci') )
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: CDK assertion tests and synth (make synth)
        run: make synth

  # 7. API performance test (platform-foundation task 11, Req 7.3).
  #
  # NON-BLOCKING by design:
  #   * It is NOT on the deploy-gating chain – nothing `needs:` this job, and it
  #     only `needs: build-images` so it can bring up the same compose stack in
  #     parallel with the integration/scale/synth jobs.
  #   * `continue-on-error: true` means a p95 regression (or a hard failure) is
  #     reported but does NOT turn the workflow conclusion to failure, so it can
  #     never block deploy.yml (which gates on a successful "CI" workflow_run).
  #
  # It reports the measured p50/p95 numbers to the GitHub job summary regardless
  # of pass/fail. Today the list/summary endpoints land in the dataset-library
  # and ingestion-summary specs, so the test seeds 1,000 reviews and SKIPS the
  # bound until those endpoints exist; the numbers still get reported once they do.
  perf-test:
    name: API performance test (non-blocking)
    runs-on: ubuntu-latest
    needs: [changes, build-images]
    continue-on-error: true
    if: >-
      needs.changes.outputs.backend == 'true' &&
      ( github.ref == 'refs/heads/main' ||
        github.base_ref == 'main' ||
        contains(github.event.pull_request.labels.*.name, 'full-ci') )
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker registry mirror (avoid Docker Hub flakiness)
        # Route Docker Hub pulls through the GCR pull-through cache so the
        # Compose stack (postgres/localstack/nginx) doesn't fail CI when
        # registry-1.docker.io is slow or 5xx (seen: 502, timeouts).
        # Name-agnostic; mirror.gcr.io falls through to Docker Hub on a miss.
        run: |
          echo '{ "registry-mirrors": ["https://mirror.gcr.io"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Pre-pull public ECR images (retry on 429)
        # public.ecr.aws rate-limits anonymous pulls; the Lambda Web Adapter
        # and Amazon Linux base images are pulled by the Dockerfiles / compose
        # builds and intermittently 429 (toomanyrequests). GCR mirrors Docker
        # Hub but not public ECR, so pre-pull these with backoff into the local
        # image cache; buildx COPY --from and compose then reuse the cached
        # image instead of re-hitting the registry.
        run: |
          images="public.ecr.aws/awsguru/aws-lambda-adapter:0.8.4 public.ecr.aws/amazonlinux/amazonlinux:2023"
          for img in $images; do
            n=0
            until docker pull "$img"; do
              n=$((n+1))
              if [ "$n" -ge 6 ]; then echo "giving up on $img after $n attempts"; exit 1; fi
              echo "pull of $img failed (attempt $n); backing off..."; sleep $((n*20))
            done
          done

      - name: Set up uv (Python ${{ env.PYTHON_VERSION }})
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Bring up the container integration stack
        run: docker compose up -d --wait

      - name: Run API performance test (reports p95 to the job summary)
        working-directory: backend
        env:
          # Measure the API container that compose maps to the host.
          PERF_API_BASE_URL: http://localhost:8000
          # Reach PostgreSQL / LocalStack on the host-mapped ports to seed data.
          DATABASE_URL: postgresql+psycopg://reviewlens:reviewlens@localhost:5432/reviewlens
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          S3_BUCKET: reviewlens-local
        run: uv run pytest tests/perf -m perf --no-cov

      - name: Dump compose logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color || true

      - name: Tear down compose stack
        if: ${{ always() }}
        run: docker compose down -v || true
