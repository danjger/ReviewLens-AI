# Extraction evaluation labels (review-extraction, Requirement 8.1).
#
# Each top-level key is a page name that matches a directory under pages/
# (pages/<name>/page.html holds the saved, already-rendered HTML).
#
# Schema per page:
#   url:        str   — the page's original URL (used as the extraction URL and
#                       for same-domain next-page checks).
#   verdict:    str   — hand-checked viability verdict, one of:
#                         will_work | limited | wont_work
#                       (The run.py scorer treats this column as OPTIONAL and
#                        pluggable: dataset-ingestion's ingestion.viability.assess()
#                        adds the verdict-accuracy column to the report LATER,
#                        once that spec exists. run.py does not import viability.)
#   type:       str   — primary layout type (free-form, see tags below).
#   tags:       [str] — layout tags; the seed MUST cover every required tag in
#                       REQUIRED_LAYOUT_TAGS (see run.py). A page may carry
#                       several tags.
#   next_page:  str|null — the expected absolute next-page URL, or null when the
#                       page has no URL-based next page.
#   reviews:    [ {prefix, rating?, date?, author?} ]
#               — the hand-checked expected reviews, in page order. `prefix` is a
#                 leading substring of the review's visible text (enough to match
#                 unambiguously). rating/date/author are the expected field
#                 values (omit a field when the page does not carry it). Ordering
#                 of the list is not asserted; reviews are matched to extracted
#                 reviews by normalized-text containment on `prefix`.
#
# Layout tags used across the seed (every one is represented at least once):
#   structured_jsonld, structured_microdata, js_rendered, plain_list,
#   no_ratings, multipage, mixed_qa_seller, blocker

structured_jsonld:
  url: https://acme.example.com/crm/reviews
  verdict: will_work
  type: structured_jsonld
  tags: [structured_jsonld]
  next_page: null
  selectors:
    item: "article.review-card"
    text: ".review-body"
    rating: ".stars"
    date: "time"
    author: ".reviewer-name"
    title: "h3"
  reviews:
    - prefix: "Transformed our pipeline and the setup took one afternoon"
      rating: 5
      date: "2024-02-11"
      author: "Dana Fox"
    - prefix: "Solid product overall, though the reporting module is thin"
      rating: 4
      date: "2024-01-28"
      author: "Priya N."
    - prefix: "The mobile app lags badly on older phones"
      rating: 2
      date: "2023-12-05"
      author: "Marcus Lee"

structured_microdata:
  url: https://orchid.example.com/hotel/reviews
  verdict: will_work
  type: structured_microdata
  tags: [structured_microdata]
  next_page: null
  selectors:
    item: ".guest-review"
    text: "[itemprop='reviewBody']"
    rating: ".stars"
    date: "time"
    author: "[itemprop='author'] [itemprop='name']"
  reviews:
    - prefix: "The rooftop breakfast overlooking the harbour was the highlight"
      rating: 5
      date: "2024-07-01"
      author: "Isabelle M."
    - prefix: "Central location and comfortable beds, but the walls are thin"
      rating: 3
      date: "2024-06-15"
      author: "Hassan R."

