# Repo-root pytest config for the evaluation suites under /evals.
#
# The live-eval CI jobs (.github/workflows/evals.yml) run `pytest ../evals/...`
# from backend/, so pytest's rootdir can resolve to the repo root rather than
# backend/pyproject.toml — leaving the `live_ai` marker unregistered and
# emitting a PytestUnknownMarkWarning. Registering it here keeps the eval runs
# warning-clean. The backend suite keeps its own markers in backend/pyproject.toml.
[pytest]
markers =
    live_ai: marks tests that call the live AI API (skipped by default)
